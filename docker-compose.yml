version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: editor-marketplace-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=production-secret-key-change-in-prod-2026
    volumes:
      - editor_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  editor_data:
    driver: local
