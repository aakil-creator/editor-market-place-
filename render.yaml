services:
  - type: web
    name: syncra
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 934016522168-68h4l11qrs3g628191ala3bgugt1cs7l.apps.googleusercontent.com

