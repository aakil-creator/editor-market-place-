    <path d="M24 6 C24 16, 24 16, 34 24 C24 24, 24 24, 24 34 C24 24, 24 24, 14 24 C24 16, 24 16, 24 6 Z" fill="url(#starGrad)" stroke="#b45309" stroke-width="1"/>
    <!-- Center flare -->
    <circle cx="24" cy="24" r="3" fill="#ffffff"/>
    <circle cx="13" cy="13" r="1.5" fill="#fde68a" class="orbital-sparkle-1"/>
    <circle cx="35" cy="14" r="1.8" fill="#fde68a" class="orbital-sparkle-2"/>
    <circle cx="33" cy="33" r="1.2" fill="#fde68a" class="orbital-sparkle-3"/>
  </g>
</svg>