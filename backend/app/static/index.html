<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="description"
        content="Editor Marketplace - Hire top-tier Video Editors and English Tutors. 100% Escrow Protected.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EditorMarket">
    <title>Editor Marketplace - Video Editors & English Tutors</title>
    <script>
        // Ensure browser origin matches Google Cloud Console Authorized JavaScript origins
        if (window.location.hostname === '127.0.0.1') {
            window.location.replace(window.location.href.replace('127.0.0.1', 'localhost'));
        }
    </script>
    <link rel="icon" type="image/png" href="/static/icons/favicon.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css?v=20260923-v26-apple-and-payments">
    <!-- Google Identity Services (GIS) for real Google Single Sign-On -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Razorpay Checkout for live UPI / Cards / Net Banking Payments -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
    <!-- Optional PWA Install Banner for Mobile Users -->
    <div id="pwa-install-banner"
        style="display: none; position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 480px; margin: 0 auto; background: var(--bg-surface, #1e2230); border: 1px solid var(--border, #333a4d); border-radius: 12px; padding: 12px 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="/static/icons/icon-192.png" alt="App Icon" style="width: 40px; height: 40px; border-radius: 8px;">
            <div>
                <strong style="font-size: 0.875rem; color: #fff; display: block;">Install Editor Marketplace</strong>
                <span style="font-size: 0.75rem; color: #a0aec0;">Add to your home screen for quick access</span>
            </div>
        </div>
        <div style="display: flex; gap: 6px;">
            <button id="pwa-install-btn"
                style="background: #6c5ce7; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-size: 0.8125rem; font-weight: 600; cursor: pointer;">Install</button>
            <button onclick="document.getElementById('pwa-install-banner').style.display='none'"
                style="background: transparent; color: #a0aec0; border: none; font-size: 1.1rem; cursor: pointer; padding: 4px 8px;">✕</button>
        </div>
    </div>

    <div id="app">
        <!-- App content rendered by JS -->
    </div>

    <script src="/app.js?v=20260923-v26-apple-and-payments"></script>
    <script>
        // Force clear legacy service worker caches immediately
        if ('caches' in window) {
            caches.keys().then(keys => {
                keys.forEach(k => {
                    if (k !== 'editor-marketplace-v12-apple-and-payments') {
                        caches.delete(k);
                    }
                });
            });
        }

        // Register PWA Service Worker with auto-update
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js?v=6')
                    .then((reg) => {
                        reg.update();
                        console.log('PWA Service Worker registered:', reg.scope);
                    })
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }

        // Handle PWA Install Prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredInstallPrompt = e;
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.style.display = 'flex';
        });

        document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
            const promptEvent = window.deferredInstallPrompt;
            if (!promptEvent) return;
            promptEvent.prompt();
            const { outcome } = await promptEvent.userChoice;
            console.log(`User response to the install prompt: ${outcome}`);
            window.deferredInstallPrompt = null;
            document.getElementById('pwa-install-banner').style.display = 'none';
        });
    </script>
</body>

</html>
